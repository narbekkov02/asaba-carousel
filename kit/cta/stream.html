<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0F0F0F; }
#stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: Montserrat, sans-serif; color: #fff;
  background: radial-gradient(circle at 50% 46%, #B3141A 0%, #7A0A0E 45%, #0F0F0F 100%); }
.abs { position: absolute; }
.ring { position: absolute; left: 540px; top: 520px; width: 10px; height: 10px; border-radius: 50%; border: 6px solid #fff; transform: translate(-50%,-50%); opacity: 0; }
#icon { left: 540px; top: 520px; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
#icon img { width: 150px; height: 150px; object-fit: contain; }
#live { left: 0; right: 0; top: 700px; display: flex; justify-content: center; }
#live span { display: flex; align-items: center; gap: 18px; background: #E0262D; border: 4px solid #fff; border-radius: 60px; padding: 16px 40px; font-size: 44px; font-weight: 900; letter-spacing: 4px; }
#live i { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: block; }
#l1 { left: 0; right: 0; top: 850px; text-align: center; font-size: 84px; font-weight: 900; text-transform: uppercase; }
#clock { left: 0; right: 0; top: 960px; text-align: center; font-size: 290px; font-weight: 900; line-height: 1; letter-spacing: -6px; text-shadow: 0 18px 50px rgba(0,0,0,.5); }
#l2 { left: 0; right: 0; top: 1270px; text-align: center; font-size: 84px; font-weight: 900; text-transform: uppercase; }
#sub { left: 90px; right: 90px; top: 1400px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
#sub div { background: #fff; color: #141414; border-radius: 18px; padding: 14px 30px; font-size: 38px; font-weight: 800; }
#sub b { color: #9B0E12; }
#flash { left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="ring" id="r0"></div><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div class="abs" id="icon"><img src="../assets/tiktok.png"></div>
  <div class="abs" id="live"><span><i id="dot"></i>LIVE</span></div>
  <div class="abs" id="l1">Күн сайын</div>
  <div class="abs" id="clock">23:00</div>
  <div class="abs" id="l2">Тікелей эфир</div>
  <div class="abs" id="sub">
    <div>Сұрағыңды эфирде <b>қой</b></div>
    <div>Нұрбек Бүркітбай <b>жауап береді</b></div>
  </div>
  <div class="abs" id="flash"></div>
</div>
<script>
window.T_END = 6.0;
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-cl(x),3);
const back = x => { x=cl(x); const c=1.9; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
function pop(el,t,t0,dy=60){ const k=(t-t0)/0.45; el.style.opacity=cl(k*2); el.style.transform=`translateY(${(1-eo(k))*dy}px) scale(${0.6+0.4*back(k)})`; }
window.render = function(t){
  $('flash').style.opacity = cl(0.7-(t/0.25)*0.7);
  const k=(t-0.1)/0.5; $('icon').style.opacity=cl(k*2); $('icon').style.transform=`scale(${back(k)}) rotate(${(1-eo(k))*-90}deg)`;
  for(let i=0;i<3;i++){ const ph=((t-0.4)/1.5 - i/3); const p=ph-Math.floor(ph); const on=t>0.4+i*0.5;
    const r=$('r'+i); r.style.width=r.style.height=(230+p*420)+'px'; r.style.opacity=on?(1-p)*0.55:0; }
  pop($('live'),t,0.55,40);
  $('dot').style.opacity = 0.35+0.65*(0.5+0.5*Math.cos(t*2*Math.PI*1.4));
  pop($('l1'),t,0.85);
  // clock: digits roll in then punch
  const c=(t-1.15)/0.6; const el=$('clock'); el.style.opacity=cl(c*3);
  const s = c<1 ? 1.8-0.8*eo(c) : 1+0.05*Math.sin(cl((t-1.75)/0.3)*Math.PI);
  el.style.transform=`scale(${s})`;
  if(c<1){ const m=Math.floor(eo(c)*23); el.textContent = String(m).padStart(2,'0')+':00'; } else el.textContent='23:00';
  pop($('l2'),t,1.85);
  const kids=$('sub').children; for(let i=0;i<kids.length;i++) pop(kids[i],t,2.3+i*0.3,40);
  const z = 1+0.025*cl((t-2.8)/3.2); $('stage').style.transform=`scale(${z})`;
};
window.render(0);
</script>
</body>
</html>
